trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.8.5'

stages:
  - stage: Validate
    displayName: 'Format Check & Validate'
    jobs:
      - job: Validate
        steps:
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: $(terraformVersion)

          - script: terraform fmt -check -recursive
            displayName: 'Terraform Format Check'
            workingDirectory: '$(System.DefaultWorkingDirectory)'

          - script: |
              cd envs/dev
              terraform init -backend=false
              terraform validate
            displayName: 'Terraform Validate (dev)'

  - stage: StaticAnalysis
    displayName: 'Static Analysis'
    dependsOn: Validate
    jobs:
      - job: Lint
        steps:
          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init
              cd envs/dev
              tflint
            displayName: 'tflint'

      - job: SecurityScan
        steps:
          - script: |
              curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
              tfsec envs/dev --soft-fail
            displayName: 'tfsec'

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: StaticAnalysis
    jobs:
      - job: Plan
        steps:
          - script: |
              curl -fsSL https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip -o terraform.zip
              unzip -o terraform.zip
              sudo mv terraform /usr/local/bin/
              terraform -version
            displayName: 'Install Terraform'

          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan'
            inputs:
              azureSubscription: 'azure-terraform-sc'
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                cd envs/dev
                terraform init -backend-config="resource_group_name=rg-terraform-state" -backend-config="storage_account_name=sttffoundation2787" -backend-config="container_name=tfstate" -backend-config="key=foundations-dev.terraform.tfstate"
                terraform plan -out=tfplan

          - publish: '$(System.DefaultWorkingDirectory)/envs/dev/tfplan'
            artifact: tfplan

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    jobs:
      - deployment: Apply
        environment: 'foundations-dev-approval'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - script: |
                    curl -fsSL https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip -o terraform.zip
                    unzip -o terraform.zip
                    sudo mv terraform /usr/local/bin/
                    terraform -version
                  displayName: 'Install Terraform'

                - download: current
                  artifact: tfplan

                - task: AzureCLI@2
                  displayName: 'Terraform Init & Apply'
                  inputs:
                    azureSubscription: 'azure-terraform-sc'
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      export ARM_CLIENT_ID=$servicePrincipalId
                      export ARM_CLIENT_SECRET=$servicePrincipalKey
                      export ARM_TENANT_ID=$tenantId
                      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                      cd envs/dev
                      terraform init -backend-config="resource_group_name=rg-terraform-state" -backend-config="storage_account_name=sttffoundation2787" -backend-config="container_name=tfstate" -backend-config="key=foundations-dev.terraform.tfstate"
                      terraform apply "$(Pipeline.Workspace)/tfplan/tfplan"
